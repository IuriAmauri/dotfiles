exec-once = hyprpm reload -n

$mon_1 = "desc:LG Electronics LG ULTRAFINE"
$mon_2 = "desc:Acer Technologies X32 V2 15380001D3900"

plugin {
	split-monitor-workspaces {
		count = 10,
		keep_focused = 1,
		enable_persistent_workspaces = 1,
		enable_notifications = 1,
		enable_wapping = 1
	}
}

# Unbind Omarchy defaults
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19

unbind = SUPER, code:87 # KP-1
unbind = SUPER, code:88 # KP-2
unbind = SUPER, code:89 # KP-3
unbind = SUPER, code:83 # KP-4
unbind = SUPER, code:84 # KP-5
unbind = SUPER, code:85 # KP-6
unbind = SUPER, code:79 # KP-7
unbind = SUPER, code:80 # KP-8
unbind = SUPER, code:81 # KP-9
unbind = SUPER, code:90 # KP-0

unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19

unbind = SUPER SHIFT, code:87 # KP-1
unbind = SUPER SHIFT, code:88 # KP-2
unbind = SUPER SHIFT, code:89 # KP-3
unbind = SUPER SHIFT, code:83 # KP-4
unbind = SUPER SHIFT, code:84 # KP-5
unbind = SUPER SHIFT, code:85 # KP-6
unbind = SUPER SHIFT, code:79 # KP-7
unbind = SUPER SHIFT, code:80 # KP-8
unbind = SUPER SHIFT, code:81 # KP-9
unbind = SUPER SHIFT, code:90 # KP-0

# Move to Workspace 1-10 (Monitor 1)
bindd = SUPER, code:10, Move to workspace 1 , exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 1
bindd = SUPER, code:11, Move to workspace 2 , exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 2
bindd = SUPER, code:12, Move to workspace 3 , exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 3
bindd = SUPER, code:13, Move to workspace 4 , exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 4
bindd = SUPER, code:14, Move to workspace 5 , exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 5
