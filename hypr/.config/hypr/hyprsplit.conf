bindd = SUPER, code:18, Move to workspace 9 , exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 9
bindd = SUPER, code:19, Move to workspace 10, exec, hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:workspace 10

# Move Window to Workspace 1-10 (Monitor 1)
bindd = SUPER SHIFT, code:10, Move window to workspace 1 , exec, hyprctl dispatch movewindow mon:$mon_1; hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:movetoworkspace 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2 , exec, hyprctl dispatch movewindow mon:$mon_1; hyprctl dispatch focusmonitor $mon_1; hyprctl dispatch split:movetoworkspace 2
